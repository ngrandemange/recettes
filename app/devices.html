<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aperçu appareils — Mes Recettes</title>
<style>
body{margin:0;font:15px system-ui;background:#0f1114;color:#eee;min-height:100vh;display:flex;flex-direction:column}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#1a1d21;align-items:center}
button{background:#2a2f36;color:#eee;border:1px solid #3a414a;border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:#5fd197;color:#0c1a12;border-color:transparent;font-weight:600}
.sp{flex:1}#stage{flex:1;display:grid;place-items:center;padding:20px;overflow:hidden}
.dev{background:#000;border-radius:var(--rad);padding:var(--bez);box-shadow:0 20px 60px #000a,0 0 0 2px #444;transform-origin:center}
.dev iframe{display:block;border:0;border-radius:calc(var(--rad) - var(--bez));background:#fff}
</style></head><body>
<nav id="nav"></nav><div id="stage"></div>
<script>
const D={desktop:[1440,900,16,0,'Bureau'],ipad:[820,1180,38,14,'iPad'],iphone:[393,852,52,12,'iPhone']};
let dev='desktop',land=false,th='light';
const nav=document.getElementById('nav'),stage=document.getElementById('stage');
function draw(){
 nav.innerHTML=Object.entries(D).map(([k,v])=>`<button data-d="${k}" class="${dev==k?'on':''}">${v[4]}</button>`).join('')+
 (dev!='desktop'?`<button data-r class="on">↻ ${land?'Paysage':'Portrait'}</button>`:'')+'<span class="sp"></span>'+
 ['light','dark','gothic'].map(t=>`<button data-t="${t}" class="${th==t?'on':''}">${{light:'☀️ Clair',dark:'🌙 Sombre',gothic:'🦇 Gothique'}[t]}</button>`).join('');
 let [w,h,rad,bez]=D[dev]; if(dev!='desktop'&&land)[w,h]=[h,w]; if(dev=='desktop')bez=0;
 const s=Math.min((innerWidth-60)/(w+2*bez),(innerHeight-nav.offsetHeight-50)/(h+2*bez),1);
 stage.innerHTML=`<div style="width:${(w+2*bez)*s}px;height:${(h+2*bez)*s}px"><div class="dev" style="--rad:${rad}px;--bez:${bez}px;transform:scale(${s});transform-origin:0 0"><iframe src="index.html" width="${w}" height="${h}"></iframe></div></div>`;
 const f=stage.querySelector('iframe');f.onload=()=>f.contentWindow.postMessage({theme:th},'*');
}
nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d)dev=b.dataset.d;if('r' in b.dataset)land=!land;if(b.dataset.t){th=b.dataset.t;stage.querySelector('iframe').contentWindow.postMessage({theme:th},'*');}draw();};
addEventListener('resize',draw);draw();
</script></body></html>
